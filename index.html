<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CiteLine</title>
    <meta
      name="description"
      content="Ask a life-science topic. A cited timeline draws itself as a graph you can click."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <script>
      window.visNetwork = window.vis;
    </script>
  </head>
  <body>
    <a class="skip-link" href="#composer-input">Skip to search</a>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="Topics">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">CiteLine</span>
        </div>
        <button type="button" id="new-topic" class="ghost-btn">New topic</button>
        <nav class="topic-list" aria-label="Past topics">
          <button type="button" class="topic-row" data-topic="Gene editing" data-seed="true">
            <span class="topic-title">Gene editing</span>
            <span class="topic-sub">Ask to load the canvas</span>
            <span class="topic-time">Demo</span>
          </button>
          <button type="button" class="topic-row" data-topic="GLP-1 receptor" data-seed="true">
            <span class="topic-title">GLP-1 receptor</span>
            <span class="topic-sub">Incretins · cached path</span>
            <span class="topic-time">Demo</span>
          </button>
        </nav>
        <p class="sidebar-foot">Settings</p>
      </aside>

      <div class="main-col">
        <section id="canvas" class="canvas" aria-label="Cited timeline canvas">
          <div id="graph" class="graph-host"></div>
          <div id="empty-state" class="empty-state">
            <p class="empty-title">Ask a topic.</p>
            <p class="empty-body">A cited timeline will draw itself here.</p>
          </div>
          <p id="status" class="canvas-status" role="status" aria-live="polite"></p>
          <aside id="inspector" class="inspector" hidden>
            <button type="button" id="inspector-close" class="inspector-close" aria-label="Close">
              ×
            </button>
            <div id="inspector-body"></div>
          </aside>
        </section>

        <div class="dock">
          <div id="notes-tray" class="notes-tray" hidden>
            <p class="notes-copy">Drop notes to check understanding.</p>
            <p class="notes-help">
              We’ll parse them against the timeline, flag gaps, and add nodes for what you missed.
            </p>
            <div id="notes-well" class="notes-well" tabindex="0">Drop or paste notes.</div>
          </div>
          <button type="button" id="notes-toggle" class="notes-toggle">Notes</button>
          <form id="composer" class="composer">
            <label class="sr-only" for="composer-input">Ask a life-science topic</label>
            <textarea
              id="composer-input"
              rows="1"
              placeholder="Ask a life-science topic…"
            ></textarea>
            <button type="submit" id="send-btn" class="send-btn" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.2 8.1h9.1L8 4.8l.7-.7L13.8 8l-5.1 3.9-.7-.7 3.3-3.3H2.2z" fill="currentColor" />
              </svg>
            </button>
          </form>
          <p id="toast" class="toast" hidden></p>
        </div>
      </div>
    </div>

    <script src="js/graph.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
